seo:
  titulo: Alta Ruta · Tienda de esquí, montaña y bici en Vielha
  descripcion: "Tienda de deportes de montaña en Vielha: esquí, escalada, trail y bici. Alquiler de esquís y raquetas y taller de encerado y de bicis."
  tipo: SportingGoodsStore   # tipo de schema.org
marca_pie: true   # «Web creada con NoExpertise» en el pie

secciones:
  hero:
    activa: true
    antetitulo: Tienda de montaña en Vielha desde 1994
    titulo: Material a punto antes del primer remonte
    texto: "Tienda, alquiler y taller de esquí, montaña y bici en Vielha."
    imagen: /fotos/hero.jpg
    cta: { texto: Pregunta por WhatsApp, url: "https://wa.me/34600000000" }
    cta_secundario: { texto: Precios de alquiler, url: "/#alquiler" }
    items:
      - { titulo: "8:30", texto: "abrimos todos los días en temporada de esquí" }
      - { titulo: "24 h", texto: "para tener tus esquís afilados y encerados" }
      - { titulo: "1994", texto: "el año en que abrimos en la calle Mayor" }

  deportes:
    activa: true
    antetitulo: Dos plantas en la calle Mayor
    titulo: Lo que hay en la tienda
    texto: "Material que usamos nosotros cada semana, elegido para el Pirineo."
    deportes:
      - nombre: Esquí y snow
        texto: "La planta baja entera, con prueba de botas y horno para darles forma."
        incluye: "Esquí de pista; Esquí de travesía; Snowboard; Botas; Cascos; Máscaras"
        imagen: /fotos/esqui.jpg
        imagenes: "/fotos/alquiler-esquis.jpg; /fotos/taller.jpg"
        detalle: |
          La planta de abajo es para la nieve. Tenemos esquís de pista para quien empieza y para quien baja rápido, esquís de travesía con sus pieles y cuchillas, tablas de snow y todo lo que va alrededor: botas, fijaciones, cascos, máscaras, guantes y ropa que abriga sin pesar.

          Las botas son lo más importante y lo que más tiempo nos lleva. Te medimos el pie, te las probamos con calma y, si hace falta, les damos forma en el horno para que no te hagan daño el primer día. Las fijaciones te las montamos y ajustamos en el taller, con tu peso y tu nivel.

          Si dudas entre comprar o alquilar, prueba primero con el alquiler: si luego compras el mismo modelo, te descontamos los días.
      - nombre: Montaña y trekking
        texto: "Para el valle y para las cimas, con consejo sobre tu ruta."
        incluye: "Botas de montaña; Mochilas; Ropa técnica; Bastones; Frontales"
        imagen: /fotos/montana.jpg
        imagenes: "/fotos/tienda.jpg"
        detalle: |
          Para caminar por el valle o subir a una cima de tres mil metros. Botas de montaña de piel o de tejido, mochilas de un día y de travesía, ropa técnica por capas, bastones, frontales y lo pequeño que se olvida: botiquín, manta térmica o una funda para el móvil.

          Te preguntamos qué ruta quieres hacer y en qué época, y te enseñamos lo justo para hacerla con seguridad. No hace falta salir con la mochila llena para disfrutar del monte.

          En invierno también alquilamos raquetas de nieve con bastones, para caminar por los bosques del valle sin esquís.
      - nombre: Escalada y ferratas
        texto: "Para la roca, el rocódromo y las ferratas del valle."
        incluye: "Pies de gato; Cuerdas; Arneses; Cascos; Equipos de ferrata"
        imagen: /fotos/escalada.jpg
        imagenes: "/fotos/alquiler-ferrata.jpg"
        detalle: |
          Para escalar en roca o en rocódromo y para hacer vías ferratas. Pies de gato de varias hormas, cuerdas, arneses, cascos, cintas, mosquetones y bolsas de magnesio.

          Si empiezas, ven a probarte los pies de gato sin prisa: tienen que apretar, pero no hacerte sufrir. Te explicamos cómo cuidar la cuerda y cuándo hay que cambiar un arnés o un disipador.

          Las ferratas del valle también se pueden hacer con material de alquiler: arnés, disipador y casco, revisados después de cada uso.
      - nombre: Running y trail
        texto: "Te miramos la pisada y sales a probarlas a la calle."
        incluye: "Zapatillas de trail; Zapatillas de asfalto; Mochilas de hidratación; Ropa ligera"
        imagen: /fotos/running.jpg
        detalle: |
          Zapatillas para correr por montaña y por asfalto, mochilas y chalecos de hidratación, ropa ligera, frontales y bastones plegables para las carreras largas.

          Antes de recomendarte unas zapatillas te miramos cómo pisas y te preguntamos por dónde corres y cuántos kilómetros haces a la semana. Puedes salir a probarlas a la calle antes de decidir.

          Varios de nosotros corremos las carreras del valle: si preparas una, pregúntanos qué llevar.
      - nombre: Bici de montaña
        texto: "Bicis de montaña y eléctricas a la venta, con el taller al lado."
        incluye: "Bicis de montaña; Bicis eléctricas; Cascos; Recambios; Ropa de bici"
        imagen: /fotos/bici.jpg

  alquiler:
    activa: true
    antetitulo: Precios por persona, con IVA
    titulo: Alquiler por días
    texto: "Recoge el material la tarde antes sin coste y devuélvelo el último día antes de cerrar."
    columna_precio: 1 día
    columna_finde: 2 días
    columna_semana: 6 días
    nota: "Fianza con DNI. Para grupos de más de ocho personas o escuelas, pregúntanos."
    cta: { texto: Reservar por WhatsApp, url: "https://wa.me/34600000000" }
    material:
      - nombre: Equipo de esquí completo
        categoria: Esquí
        texto: "Esquís, botas y bastones. Ajuste de fijaciones incluido."
        precio: "28 €"
        precio_finde: "52 €"
        precio_semana: "135 €"
        imagen: /fotos/alquiler-esquis.jpg
        detalle: |
          Esquís, botas y bastones listos para subir a pistas. Elegimos los esquís según tu nivel, tu altura y tu peso, y te ajustamos las fijaciones en el momento. Las botas se prueban con calma: si te aprietan, te cambiamos de talla o de modelo sin coste.

          Para tenerlo todo preparado, escríbenos antes con los días, la altura, el peso y el número de pie de cada persona. Puedes recogerlo la tarde anterior a partir de las cinco y subir a primera hora sin esperar.

          El casco no va incluido: lo puedes alquilar aparte o traer el tuyo.
      - nombre: Esquís de travesía con pieles
        categoria: Esquí
        texto: "Esquís, botas de travesía, pieles y cuchillas."
        precio: "45 €"
        precio_finde: "85 €"
        precio_semana: "220 €"
      - nombre: Casco de esquí
        categoria: Esquí
        texto: "Tallas para niños y adultos."
        precio: "6 €"
        precio_finde: "10 €"
        precio_semana: "25 €"
      - nombre: Raquetas de nieve con bastones
        categoria: Montaña
        texto: "Para caminar por los bosques nevados del valle."
        precio: "12 €"
        precio_finde: "22 €"
        precio_semana: "50 €"
        imagen: /fotos/alquiler-raquetas.jpg
        detalle: |
          Raquetas de nieve con bastones para caminar por los bosques y las pistas forestales del valle cuando hay nieve. No hace falta experiencia: te enseñamos a ajustarlas en la tienda en cinco minutos.

          Con unas botas de montaña impermeables es suficiente. Si no tienes, pregúntanos y te las buscamos.

          Te recomendamos rutas sencillas según la nieve que haya ese día y te avisamos si hay riesgo de aludes en la zona.
      - nombre: Equipo de vía ferrata
        categoria: Montaña
        texto: "Arnés, disipador y casco, revisados después de cada uso."
        precio: "15 €"
        precio_finde: "28 €"
        precio_semana: ""
        imagen: /fotos/alquiler-ferrata.jpg
        detalle: |
          Arnés, disipador de energía con sus mosquetones y casco. Lo revisamos todo después de cada uso y anotamos la fecha de cada disipador, que es la pieza que más cuidado necesita.

          Antes de salir te explicamos cómo se pone y cómo se pasan los mosquetones en cada anclaje. Si es tu primera ferrata, te decimos cuál del valle conviene para empezar.

          Hay tallas de arnés para niños a partir de unos 30 kilos.
      - nombre: Bici de montaña eléctrica
        categoria: Bici
        texto: "Con casco, candado y cargador."
        precio: "55 €"
        precio_finde: "100 €"
        precio_semana: "260 €"
        imagen: /fotos/alquiler-bici.jpg
        detalle: |
          Bicis de montaña eléctricas con doble suspensión, casco, candado y cargador. Con la batería llena da para una jornada larga por las pistas del valle.

          Te ajustamos el sillín y las suspensiones a tu peso antes de salir y te explicamos los modos de asistencia para que la batería te dure toda la ruta.

          Si vienes en grupo, avísanos con unos días: en verano se reservan pronto.
      - nombre: Bici de montaña
        categoria: Bici
        texto: "Doble suspensión, tallas de la S a la XL."
        precio: "32 €"
        precio_finde: "60 €"
        precio_semana: "150 €"

