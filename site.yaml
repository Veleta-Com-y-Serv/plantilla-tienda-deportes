      - { nombre: Purgado de frenos hidráulicos, categoria: Bici, plazo: En el día, precio: "20 €" }
      - { nombre: Cambio de cubierta y líquido tubeless, categoria: Bici, plazo: Al momento, precio: "12 €" }

  equipo:
    activa: true
    antetitulo: Quién te atiende
    titulo: Lo probamos antes de vendértelo
    texto: "Somos esquiadores, escaladores y corredores del valle. Pregúntanos sin prisa: te decimos lo que usaríamos nosotros."
    personas:
      - { nombre: Marta Sabaté, cargo: Esquí de travesía y alquiler, texto: "Técnica deportiva de esquí. Te ajusta las botas como si fueran suyas.", foto: /placeholders/persona.svg }
      - { nombre: Jordi Aubert, cargo: Taller de bici, texto: "Mecánico y corredor de enduro. Si algo cruje, lo encuentra.", foto: /placeholders/persona.svg }
      - { nombre: Laia Moga, cargo: Escalada y ferratas, texto: "Escala desde los doce años y conoce cada ferrata del valle.", foto: /placeholders/persona.svg }

  clubes:
    activa: true
    antetitulo: Clubes, escuelas y empresas
    titulo: Equipación con vuestro escudo
    texto: "Ropa técnica para clubes de esquí, de montaña y de atletismo, escuelas y empresas del valle."
    cta: { texto: Pedir presupuesto para el club, url: "/#contacto" }
    items:
      - { titulo: Nos contáis, texto: "Qué deporte, cuántas personas y para cuándo lo necesitáis." }
      - { titulo: Probáis las tallas, texto: "Os dejamos una muestra de cada prenda durante una semana." }
      - { titulo: Cerramos el pedido, texto: "Escudo, colores y precio por prenda, todo por escrito." }
      - { titulo: Lo recogéis, texto: "Cada prenda marcada con su nombre, en tres o cuatro semanas." }

  tienda:
    activa: true
    antetitulo: Horario y cómo llegar
    titulo: Estamos en la calle Mayor
    texto: "En el centro de Vielha, a dos minutos de la plaza de la iglesia. Hay aparcamiento público a 200 metros."
    imagen: /fotos/tienda.jpg
    cta: { texto: Cómo llegar, url: "https://www.google.com/maps/search/?api=1&query=Vielha" }
    horario:
      - { dia: Lunes a sábado, horas: "9:30 a 13:30 y 16:30 a 20:30" }
      - { dia: Domingos, horas: "9:30 a 13:30" }
      - { dia: Temporada de esquí, horas: "Todos los días desde las 8:30" }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen quienes vuelven
    testimonios:
      - { texto: "Me dejaron las botas de esquí hechas a mi pie en una tarde. Primer día sin rozaduras en años.", autor: Elena G., nota: Google }
      - { texto: "Alquilamos raquetas para toda la familia y nos recomendaron una ruta perfecta para los niños.", autor: Pau R., nota: Google }
      - { texto: "Llevé la bici con los frenos fatal por la mañana y por la tarde estaba lista. Trato de diez.", autor: Sergio M. }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: ¿Puedo reservar el material de alquiler?, respuesta: "Sí. Escríbenos por WhatsApp con los días, la altura, el peso y el número de pie de cada persona y te lo dejamos preparado." }
      - { pregunta: ¿Puedo recoger los esquís la tarde antes?, respuesta: "Sí, a partir de las 17:00 del día anterior y sin coste. Así subes a pistas a primera hora sin esperar." }
      - { pregunta: ¿Cuánto tarda el encerado?, respuesta: "El encerado en caliente está en el día si lo traes antes de las 11:00. El afilado con encerado, en 24 horas." }
      - { pregunta: ¿Arregláis bicis que no son de la tienda?, respuesta: "Sí, arreglamos cualquier bici. En verano conviene pedir hueco con un par de días de antelación." }
      - { pregunta: "Empiezo en la escalada, ¿qué necesito?", respuesta: "Pies de gato, arnés y una bolsa de magnesio para el rocódromo. Ven a probártelos: te enseñamos lo justo para empezar." }

  contacto:
